name: Redmi AX6000 honk firmware

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ax6000-firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: "2"
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang llvm flex bison             g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools             rsync swig unzip zlib1g-dev file wget curl ca-certificates cpio libelf-dev cmake             ninja-build pkg-config libclang-dev zstd squashfs-tools device-tree-compiler liblzma-dev
          df -h .
      - name: Restore downloads and compiler cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            dl
            .ccache
          key: ax6000-ubuntu24-${{ hashFiles('custom/ax6000/versions.env', 'custom/ax6000/feeds.lock', 'custom/ax6000/*.config', 'custom/ax6000/config.seed') }}
      - name: Prepare pinned feeds and configuration
        run: bash custom/ax6000/prepare.sh 2>&1 | tee prepare.log
      - name: Prepare pinned honk toolchains
        run: bash custom/ax6000/setup-honk-tools.sh 2>&1 | tee honk-tools.log
      - name: Download sources
        run: make download -j8 2>&1 | tee download.log
      - name: Compile firmware
        run: make -j"$(nproc)" 2>&1 | tee build.log
      - name: Verify effective kernel and firmware contents
        run: python3 custom/ax6000/verify.py artifacts 2>&1 | tee verify.log
      - name: Upload verified firmware and matching packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ax6000-honk-${{ github.run_id }}
          path: bin/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ax6000-build-logs-${{ github.run_id }}
          path: |
            *.log
            logs/
            .config
            bin/ax6000-evidence/
          include-hidden-files: true
          retention-days: 14
